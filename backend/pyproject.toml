[project]
name = "whaleproof"
version = "0.1.0"
description = "Which whale signals actually paid — backtested confluence scoring on Unusual Whales data."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "exchange-calendars>=4.5",
  "apscheduler>=3.10,<4",
  "tzdata>=2024.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "mcp>=1.10",
]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
whaleproof = "whaleproof.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whaleproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: hits the real UW API (needs UW_API_KEY)"]
addopts = "-m 'not live'"
